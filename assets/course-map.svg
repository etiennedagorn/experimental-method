<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" role="img" aria-labelledby="title desc">
  <title id="title">Course sequence for Experimental Analysis of Public Policies</title>
  <desc id="desc">A visual map from causal questions and counterfactuals through selection, randomisation, IV, difference-in-differences, regression discontinuity, synthetic control, heterogeneity, external validity, and replication.</desc>
  <rect width="980" height="270" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#172033">
    <text x="36" y="42" font-size="24" font-weight="700">Cumulative Design Logic</text>
    <text x="36" y="70" fill="#53627a">Each method is another way to construct and defend the missing counterfactual.</text>
  </g>
  <g stroke="#75839a" stroke-width="2" fill="none">
    <path d="M144 138 H830"/>
    <path d="M830 138 l-12 -8"/>
    <path d="M830 138 l-12 8"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">
    <g transform="translate(90,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#eaf3ff" stroke="#3266a8"/>
      <text y="-4" font-weight="700" fill="#17324f">Question</text>
      <text y="17" fill="#24415f">Estimand</text>
      <text y="34" fill="#24415f">Counterfactual</text>
    </g>
    <g transform="translate(220,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#f0fdf4" stroke="#20836f"/>
      <text y="-4" font-weight="700" fill="#17483f">Selection</text>
      <text y="17" fill="#28564c">Regression</text>
      <text y="34" fill="#28564c">Matching</text>
    </g>
    <g transform="translate(350,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#fff7e6" stroke="#b56b1c"/>
      <text y="-4" font-weight="700" fill="#5a3512">RCT</text>
      <text y="17" fill="#6b4219">Design</text>
      <text y="34" fill="#6b4219">Power</text>
    </g>
    <g transform="translate(480,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#f9edf4" stroke="#a84d77"/>
      <text y="-4" font-weight="700" fill="#5c263f">IV</text>
      <text y="17" fill="#69324b">Compliance</text>
      <text y="34" fill="#69324b">LATE</text>
    </g>
    <g transform="translate(610,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#eaf7f6" stroke="#26817f"/>
      <text y="-4" font-weight="700" fill="#17484a">DiD</text>
      <text y="17" fill="#28575a">Event time</text>
      <text y="34" fill="#28575a">Staggered</text>
    </g>
    <g transform="translate(740,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#f1f5f9" stroke="#64748b"/>
      <text y="-4" font-weight="700" fill="#253246">RDD</text>
      <text y="17" fill="#3c485b">Thresholds</text>
      <text y="34" fill="#3c485b">Local effects</text>
    </g>
    <g transform="translate(870,120)">
      <rect x="-58" y="-26" width="116" height="70" rx="6" fill="#eef2ff" stroke="#5b65c6"/>
      <text y="-4" font-weight="700" fill="#30366f">Synthesis</text>
      <text y="17" fill="#444b82">SCM and HTE</text>
      <text y="34" fill="#444b82">Replication</text>
    </g>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#172033">
    <text x="180" y="220" font-weight="700">Course reflex:</text>
    <text x="300" y="220">variation, assumption, estimand or population.</text>
  </g>
</svg>
